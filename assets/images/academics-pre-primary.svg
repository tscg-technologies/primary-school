<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_preprimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0EB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid_preprimary" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#2457A6" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="640" height="360" rx="16" fill="url(#bgGrad_preprimary)"/>
  <rect width="640" height="360" rx="16" fill="url(#grid_preprimary)"/>

  <!-- Decorative geometric accents -->
  <circle cx="80" cy="60" r="40" fill="#FFC857" opacity="0.3"/>
  <circle cx="580" cy="300" r="50" fill="#FF8066" opacity="0.2"/>
  <circle cx="560" cy="60" r="30" fill="#4D96FF" opacity="0.25"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 15)">
    
      <!-- Toddler blocks, teddy bear silhouette, rainbow -->
      <path d="M160 210a120 120 0 0 1 200 0" fill="none" stroke="#FF8066" stroke-width="14"/>
      <path d="M175 210a105 105 0 0 1 170 0" fill="none" stroke="#FFC857" stroke-width="14"/>
      <path d="M190 210a90 90 0 0 1 140 0" fill="none" stroke="#4D96FF" stroke-width="14"/>
      <!-- Wooden blocks ABC -->
      <rect x="360" y="150" width="55" height="55" rx="8" fill="#2457A6"/>
      <text x="387" y="188" fill="#FFFFFF" font-size="28" font-family="'Nunito', sans-serif" font-weight="900" text-anchor="middle">A</text>
      <rect x="425" y="150" width="55" height="55" rx="8" fill="#FF8066"/>
      <text x="452" y="188" fill="#FFFFFF" font-size="28" font-family="'Nunito', sans-serif" font-weight="900" text-anchor="middle">B</text>
      <rect x="390" y="88" width="55" height="55" rx="8" fill="#FFC857"/>
      <text x="417" y="126" fill="#263247" font-size="28" font-family="'Nunito', sans-serif" font-weight="900" text-anchor="middle">C</text>
    
  </g>

  <!-- Title & Subtitle Banner at bottom -->
  <rect x="24" y="275" width="592" height="65" rx="12" fill="#263247" opacity="0.94"/>
  <text x="44" y="305" fill="#FFFFFF" font-size="19" font-family="'Nunito', sans-serif" font-weight="800" letter-spacing="0.5">Pre-Primary Program</text>
  <text x="44" y="325" fill="#FFC857" font-size="13" font-family="'Poppins', sans-serif" font-weight="500">Ages 2.5 – 3.5 Years • Playgroup & Nursery</text>

  <!-- Demo Badge -->
  <g transform="translate(500, 287)">
    <rect width="100" height="24" rx="12" fill="#FF8066"/>
    <text x="50" y="16" fill="#FFFFFF" font-size="10" font-family="'Poppins', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.8">ACADEMIC DEMO</text>
  </g>
</svg>