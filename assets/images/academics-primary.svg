<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid_primary" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#2457A6" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="640" height="360" rx="16" fill="url(#bgGrad_primary)"/>
  <rect width="640" height="360" rx="16" fill="url(#grid_primary)"/>

  <!-- Decorative geometric accents -->
  <circle cx="80" cy="60" r="40" fill="#FFC857" opacity="0.3"/>
  <circle cx="580" cy="300" r="50" fill="#FF8066" opacity="0.2"/>
  <circle cx="560" cy="60" r="30" fill="#4D96FF" opacity="0.25"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 15)">
    
      <!-- Open notebook, fountain pen, graduation cap, geometry -->
      <rect x="160" y="80" width="180" height="130" rx="8" fill="#FFFFFF" stroke="#2457A6" stroke-width="4"/>
      <line x1="250" y1="80" x2="250" y2="210" stroke="#CBD5E1" stroke-width="2"/>
      <line x1="175" y1="105" x2="235" y2="105" stroke="#263247" stroke-width="2" stroke-linecap="round"/>
      <line x1="175" y1="125" x2="235" y2="125" stroke="#263247" stroke-width="2" stroke-linecap="round"/>
      <line x1="175" y1="145" x2="220" y2="145" stroke="#263247" stroke-width="2" stroke-linecap="round"/>
      <line x1="265" y1="105" x2="325" y2="105" stroke="#263247" stroke-width="2" stroke-linecap="round"/>
      <line x1="265" y1="125" x2="325" y2="125" stroke="#263247" stroke-width="2" stroke-linecap="round"/>
      <line x1="265" y1="145" x2="310" y2="145" stroke="#263247" stroke-width="2" stroke-linecap="round"/>
      <!-- Graduation cap / Scholar symbol -->
      <polygon points="410,105 450,85 490,105 450,125" fill="#263247"/>
      <rect x="435" y="125" width="30" height="16" rx="4" fill="#263247"/>
      <path d="M490 105v35" stroke="#FFC857" stroke-width="3" stroke-linecap="round"/>
      <circle cx="490" cy="142" r="4" fill="#FFC857"/>
      <!-- Compass / Ruler -->
      <polygon points="360,190 400,190 420,210 380,210" fill="#FFC857" stroke="#263247" stroke-width="2"/>
    
  </g>

  <!-- Title & Subtitle Banner at bottom -->
  <rect x="24" y="275" width="592" height="65" rx="12" fill="#263247" opacity="0.94"/>
  <text x="44" y="305" fill="#FFFFFF" font-size="19" font-family="'Nunito', sans-serif" font-weight="800" letter-spacing="0.5">Primary Education (Grades 1–5)</text>
  <text x="44" y="325" fill="#FFC857" font-size="13" font-family="'Poppins', sans-serif" font-weight="500">Ages 6 – 11 Years • Core Academic Excellence</text>

  <!-- Demo Badge -->
  <g transform="translate(500, 287)">
    <rect width="100" height="24" rx="12" fill="#FF8066"/>
    <text x="50" y="16" fill="#FFFFFF" font-size="10" font-family="'Poppins', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.8">ACADEMIC DEMO</text>
  </g>
</svg>