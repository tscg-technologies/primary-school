<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_indoor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF2FA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid_indoor" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#2457A6" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="640" height="360" rx="16" fill="url(#bgGrad_indoor)"/>
  <rect width="640" height="360" rx="16" fill="url(#grid_indoor)"/>

  <!-- Decorative geometric accents -->
  <circle cx="80" cy="60" r="40" fill="#FFC857" opacity="0.3"/>
  <circle cx="580" cy="300" r="50" fill="#FF8066" opacity="0.2"/>
  <circle cx="560" cy="60" r="30" fill="#4D96FF" opacity="0.25"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 15)">
    
      <!-- Soft play building blocks & slide -->
      <rect x="140" y="160" width="60" height="60" rx="8" fill="#FF8066"/>
      <rect x="210" y="160" width="60" height="60" rx="8" fill="#FFC857"/>
      <polygon points="170,100 130,160 210,160" fill="#4D96FF"/>
      <circle cx="340" cy="180" r="35" fill="#5CD85A"/>
      <circle cx="340" cy="180" r="20" fill="#FFFFFF"/>
      <!-- Small climbing frame -->
      <path d="M410 230l40-90 40 90" stroke="#2457A6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="425" y1="195" x2="475" y2="195" stroke="#FFC857" stroke-width="6"/>
      <line x1="435" y1="165" x2="465" y2="165" stroke="#FF8066" stroke-width="6"/>
    
  </g>

  <!-- Title & Subtitle Banner at bottom -->
  <rect x="24" y="275" width="592" height="65" rx="12" fill="#263247" opacity="0.94"/>
  <text x="44" y="305" fill="#FFFFFF" font-size="19" font-family="'Nunito', sans-serif" font-weight="800" letter-spacing="0.5">Indoor Activity Space</text>
  <text x="44" y="325" fill="#FFC857" font-size="13" font-family="'Poppins', sans-serif" font-weight="500">Soft Mats, Building Blocks & Creative Corner</text>

  <!-- Demo Badge -->
  <g transform="translate(500, 287)">
    <rect width="100" height="24" rx="12" fill="#FF8066"/>
    <text x="50" y="16" fill="#FFFFFF" font-size="10" font-family="'Poppins', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.8">FACILITY DEMO</text>
  </g>
</svg>