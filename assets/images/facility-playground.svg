<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_playground" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF2FA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid_playground" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#2457A6" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="640" height="360" rx="16" fill="url(#bgGrad_playground)"/>
  <rect width="640" height="360" rx="16" fill="url(#grid_playground)"/>

  <!-- Decorative geometric accents -->
  <circle cx="80" cy="60" r="40" fill="#FFC857" opacity="0.3"/>
  <circle cx="580" cy="300" r="50" fill="#FF8066" opacity="0.2"/>
  <circle cx="560" cy="60" r="30" fill="#4D96FF" opacity="0.25"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 15)">
    
      <!-- Swings & Slide -->
      <!-- Swing Frame -->
      <path d="M150 230l40-140 40 140M270 230l40-140 40 140" stroke="#2457A6" stroke-width="6" stroke-linecap="round"/>
      <line x1="170" y1="90" x2="330" y2="90" stroke="#2457A6" stroke-width="8" stroke-linecap="round"/>
      <!-- Swing ropes -->
      <line x1="210" y1="95" x2="210" y2="175" stroke="#263247" stroke-width="3"/>
      <line x1="240" y1="95" x2="240" y2="175" stroke="#263247" stroke-width="3"/>
      <rect x="200" y="175" width="50" height="10" rx="3" fill="#FF8066"/>
      <!-- Slide -->
      <path d="M370 230v-110h40l80 110" stroke="#FF8066" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="470" cy="70" r="25" fill="#FFC857" opacity="0.8"/>
    
  </g>

  <!-- Title & Subtitle Banner at bottom -->
  <rect x="24" y="275" width="592" height="65" rx="12" fill="#263247" opacity="0.94"/>
  <text x="44" y="305" fill="#FFFFFF" font-size="19" font-family="'Nunito', sans-serif" font-weight="800" letter-spacing="0.5">Outdoor Playground</text>
  <text x="44" y="325" fill="#FFC857" font-size="13" font-family="'Poppins', sans-serif" font-weight="500">Safe Turf, Swings, Slides & Running Track</text>

  <!-- Demo Badge -->
  <g transform="translate(500, 287)">
    <rect width="100" height="24" rx="12" fill="#FF8066"/>
    <text x="50" y="16" fill="#FFFFFF" font-size="10" font-family="'Poppins', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.8">FACILITY DEMO</text>
  </g>
</svg>