<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_cultural" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF2FA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid_cultural" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#2457A6" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="640" height="360" rx="16" fill="url(#bgGrad_cultural)"/>
  <rect width="640" height="360" rx="16" fill="url(#grid_cultural)"/>

  <!-- Decorative geometric accents -->
  <circle cx="80" cy="60" r="40" fill="#FFC857" opacity="0.3"/>
  <circle cx="580" cy="300" r="50" fill="#FF8066" opacity="0.2"/>
  <circle cx="560" cy="60" r="30" fill="#4D96FF" opacity="0.25"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 15)">
    
      <!-- Festive Diyas, garlands, celebration -->
      <path d="M220 170c0 20 25 35 50 35s50-15 50-35h-100z" fill="#FF8066" stroke="#263247" stroke-width="3"/>
      <!-- Flame -->
      <path d="M270 170c-10-15 0-35 0-35s10 20 0 35z" fill="#FFC857"/>
      <path d="M270 165c-4-8 0-18 0-18s4 10 0 18z" fill="#FF5722"/>
      <!-- Bunting flags -->
      <path d="M120 70q120 30 200 0t200 0" fill="none" stroke="#263247" stroke-width="2"/>
      <polygon points="150,75 170,78 160,105" fill="#FF8066"/>
      <polygon points="190,82 210,84 200,110" fill="#FFC857"/>
      <polygon points="230,85 250,86 240,112" fill="#4D96FF"/>
      <polygon points="270,85 290,85 280,112" fill="#5CD85A"/>
      <polygon points="310,84 330,82 320,110" fill="#2457A6"/>
      <polygon points="350,79 370,77 360,105" fill="#FF8066"/>
      <polygon points="390,75 410,72 400,100" fill="#FFC857"/>
      <!-- Festive rangoli petals -->
      <circle cx="430" cy="170" r="30" fill="#FFFFFF" stroke="#2457A6" stroke-width="3"/>
      <circle cx="430" cy="170" r="14" fill="#FF8066"/>
    
  </g>

  <!-- Title & Subtitle Banner at bottom -->
  <rect x="24" y="275" width="592" height="65" rx="12" fill="#263247" opacity="0.94"/>
  <text x="44" y="305" fill="#FFFFFF" font-size="19" font-family="'Nunito', sans-serif" font-weight="800" letter-spacing="0.5">Heritage Festival Day</text>
  <text x="44" y="325" fill="#FFC857" font-size="13" font-family="'Poppins', sans-serif" font-weight="500">Events • Traditional Attire & Folk Dances</text>

  <!-- Demo Badge -->
  <g transform="translate(500, 287)">
    <rect width="100" height="24" rx="12" fill="#FF8066"/>
    <text x="50" y="16" fill="#FFFFFF" font-size="10" font-family="'Poppins', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.8">GALLERY DEMO</text>
  </g>
</svg>