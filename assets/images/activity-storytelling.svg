<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_storytelling" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF2FA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid_storytelling" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#2457A6" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="640" height="360" rx="16" fill="url(#bgGrad_storytelling)"/>
  <rect width="640" height="360" rx="16" fill="url(#grid_storytelling)"/>

  <!-- Decorative geometric accents -->
  <circle cx="80" cy="60" r="40" fill="#FFC857" opacity="0.3"/>
  <circle cx="580" cy="300" r="50" fill="#FF8066" opacity="0.2"/>
  <circle cx="560" cy="60" r="30" fill="#4D96FF" opacity="0.25"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 15)">
    
      <!-- Open fairytale book with castle, stars -->
      <path d="M180 200c35-15 80-15 120 10 40-25 85-25 120-10v-90c-35-15-80-15-120 10-40-25-85-25-120-10v90z" fill="#FFFFFF" stroke="#2457A6" stroke-width="4"/>
      <!-- Glowing magical rays -->
      <path d="M300 120v-40M275 130l-25-30M325 130l25-30" stroke="#FFC857" stroke-width="4" stroke-linecap="round"/>
      <polygon points="300,55 304,67 317,67 306,75 310,87 300,79 290,87 294,75 283,67 296,67" fill="#FFC857"/>
      <polygon points="250,75 253,83 262,83 255,89 257,97 250,92 243,97 245,89 238,83 247,83" fill="#FF8066"/>
      <polygon points="350,75 353,83 362,83 355,89 357,97 350,92 343,97 345,89 338,83 347,83" fill="#4D96FF"/>
    
  </g>

  <!-- Title & Subtitle Banner at bottom -->
  <rect x="24" y="275" width="592" height="65" rx="12" fill="#263247" opacity="0.94"/>
  <text x="44" y="305" fill="#FFFFFF" font-size="19" font-family="'Nunito', sans-serif" font-weight="800" letter-spacing="0.5">Storytelling & Drama</text>
  <text x="44" y="325" fill="#FFC857" font-size="13" font-family="'Poppins', sans-serif" font-weight="500">Voice Modulation, Puppetry & Language Growth</text>

  <!-- Demo Badge -->
  <g transform="translate(500, 287)">
    <rect width="100" height="24" rx="12" fill="#FF8066"/>
    <text x="50" y="16" fill="#FFFFFF" font-size="10" font-family="'Poppins', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.8">ACTIVITY DEMO</text>
  </g>
</svg>