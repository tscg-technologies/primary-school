<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_computer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF2FA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid_computer" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#2457A6" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="640" height="360" rx="16" fill="url(#bgGrad_computer)"/>
  <rect width="640" height="360" rx="16" fill="url(#grid_computer)"/>

  <!-- Decorative geometric accents -->
  <circle cx="80" cy="60" r="40" fill="#FFC857" opacity="0.3"/>
  <circle cx="580" cy="300" r="50" fill="#FF8066" opacity="0.2"/>
  <circle cx="560" cy="60" r="30" fill="#4D96FF" opacity="0.25"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 15)">
    
      <!-- Desktop monitors -->
      <rect x="160" y="90" width="140" height="95" rx="8" fill="#263247" stroke="#4D96FF" stroke-width="3"/>
      <rect x="170" y="100" width="120" height="75" rx="4" fill="#EBF2FA"/>
      <!-- Code lines on screen -->
      <line x1="180" y1="115" x2="230" y2="115" stroke="#2457A6" stroke-width="4" stroke-linecap="round"/>
      <line x1="180" y1="130" x2="260" y2="130" stroke="#FF8066" stroke-width="4" stroke-linecap="round"/>
      <line x1="180" y1="145" x2="210" y2="145" stroke="#5CD85A" stroke-width="4" stroke-linecap="round"/>
      <line x1="180" y1="160" x2="245" y2="160" stroke="#FFC857" stroke-width="4" stroke-linecap="round"/>
      <!-- Stand -->
      <path d="M220 185v25M200 210h60" stroke="#263247" stroke-width="6" stroke-linecap="round"/>
      <!-- Second screen -->
      <rect x="340" y="90" width="140" height="95" rx="8" fill="#263247" stroke="#FFC857" stroke-width="3"/>
      <rect x="350" y="100" width="120" height="75" rx="4" fill="#EBF2FA"/>
      <path d="M375 145l20-25 20 15 25-20" fill="none" stroke="#2457A6" stroke-width="4" stroke-linecap="round"/>
      <path d="M400 185v25M380 210h60" stroke="#263247" stroke-width="6" stroke-linecap="round"/>
      <!-- Table surface -->
      <rect x="100" y="230" width="440" height="14" rx="7" fill="#2457A6"/>
    
  </g>

  <!-- Title & Subtitle Banner at bottom -->
  <rect x="24" y="275" width="592" height="65" rx="12" fill="#263247" opacity="0.94"/>
  <text x="44" y="305" fill="#FFFFFF" font-size="19" font-family="'Nunito', sans-serif" font-weight="800" letter-spacing="0.5">Computer Learning Lab</text>
  <text x="44" y="325" fill="#FFC857" font-size="13" font-family="'Poppins', sans-serif" font-weight="500">Child-Safe Coding & Digital Literacy Station</text>

  <!-- Demo Badge -->
  <g transform="translate(500, 287)">
    <rect width="100" height="24" rx="12" fill="#FF8066"/>
    <text x="50" y="16" fill="#FFFFFF" font-size="10" font-family="'Poppins', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.8">FACILITY DEMO</text>
  </g>
</svg>