<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_science" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF2FA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid_science" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#2457A6" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="640" height="360" rx="16" fill="url(#bgGrad_science)"/>
  <rect width="640" height="360" rx="16" fill="url(#grid_science)"/>

  <!-- Decorative geometric accents -->
  <circle cx="80" cy="60" r="40" fill="#FFC857" opacity="0.3"/>
  <circle cx="580" cy="300" r="50" fill="#FF8066" opacity="0.2"/>
  <circle cx="560" cy="60" r="30" fill="#4D96FF" opacity="0.25"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 15)">
    
      <!-- Flask and beaker -->
      <path d="M230 110h20v25l25 45c5 8 0 16-10 16h-50c-10 0-15-8-10-16l25-45z" fill="#EBF2FA" stroke="#2457A6" stroke-width="4"/>
      <path d="M205 180h70c2 4-2 16-10 16h-50c-8 0-12-12-10-16z" fill="#4D96FF" opacity="0.7"/>
      <circle cx="235" cy="165" r="4" fill="#FFFFFF"/>
      <circle cx="245" cy="150" r="5" fill="#FFFFFF"/>
      <circle cx="242" cy="175" r="3" fill="#FFFFFF"/>
      <!-- Test tubes rack -->
      <rect x="330" y="140" width="110" height="15" rx="4" fill="#263247"/>
      <rect x="345" y="95" width="16" height="65" rx="8" fill="#FFC857" stroke="#2457A6" stroke-width="3"/>
      <rect x="375" y="85" width="16" height="75" rx="8" fill="#FF8066" stroke="#2457A6" stroke-width="3"/>
      <rect x="405" y="100" width="16" height="60" rx="8" fill="#5CD85A" stroke="#2457A6" stroke-width="3"/>
      <!-- Atom orbit -->
      <ellipse cx="490" cy="90" rx="28" ry="12" fill="none" stroke="#FF8066" stroke-width="2" transform="rotate(30 490 90)"/>
      <ellipse cx="490" cy="90" rx="28" ry="12" fill="none" stroke="#2457A6" stroke-width="2" transform="rotate(-30 490 90)"/>
      <circle cx="490" cy="90" r="6" fill="#FFC857"/>
    
  </g>

  <!-- Title & Subtitle Banner at bottom -->
  <rect x="24" y="275" width="592" height="65" rx="12" fill="#263247" opacity="0.94"/>
  <text x="44" y="305" fill="#FFFFFF" font-size="19" font-family="'Nunito', sans-serif" font-weight="800" letter-spacing="0.5">Young Explorers Science Fair</text>
  <text x="44" y="325" fill="#FFC857" font-size="13" font-family="'Poppins', sans-serif" font-weight="500">Events • Models, Volcanoes & Solar Systems</text>

  <!-- Demo Badge -->
  <g transform="translate(500, 287)">
    <rect width="100" height="24" rx="12" fill="#FF8066"/>
    <text x="50" y="16" fill="#FFFFFF" font-size="10" font-family="'Poppins', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.8">GALLERY DEMO</text>
  </g>
</svg>