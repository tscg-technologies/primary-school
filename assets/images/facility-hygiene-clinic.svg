<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_hygiene" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF2FA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid_hygiene" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#2457A6" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="640" height="360" rx="16" fill="url(#bgGrad_hygiene)"/>
  <rect width="640" height="360" rx="16" fill="url(#grid_hygiene)"/>

  <!-- Decorative geometric accents -->
  <circle cx="80" cy="60" r="40" fill="#FFC857" opacity="0.3"/>
  <circle cx="580" cy="300" r="50" fill="#FF8066" opacity="0.2"/>
  <circle cx="560" cy="60" r="30" fill="#4D96FF" opacity="0.25"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 15)">
    
      <!-- Clinic / Clean Environment -->
      <rect x="200" y="70" width="240" height="160" rx="16" fill="#FFFFFF" stroke="#5CD85A" stroke-width="4"/>
      <!-- Red/Mint Cross -->
      <rect x="305" y="105" width="30" height="85" rx="6" fill="#5CD85A"/>
      <rect x="277" y="132" width="85" height="30" rx="6" fill="#5CD85A"/>
      <!-- Shield -->
      <path d="M160 110c0 40 40 70 40 70s40-30 40-70v-30l-40-15-40 15v30z" fill="#2457A6" opacity="0.9"/>
      <path d="M185 125l10 10 20-20" fill="none" stroke="#FFC857" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Sparkles -->
      <circle cx="470" cy="90" r="12" fill="#FFC857"/>
      <circle cx="450" cy="130" r="6" fill="#FF8066"/>
      <circle cx="485" cy="140" r="8" fill="#4D96FF"/>
    
  </g>

  <!-- Title & Subtitle Banner at bottom -->
  <rect x="24" y="275" width="592" height="65" rx="12" fill="#263247" opacity="0.94"/>
  <text x="44" y="305" fill="#FFFFFF" font-size="19" font-family="'Nunito', sans-serif" font-weight="800" letter-spacing="0.5">Clean & Hygienic Campus</text>
  <text x="44" y="325" fill="#FFC857" font-size="13" font-family="'Poppins', sans-serif" font-weight="500">Sanitized Spaces, Medical Room & Pure Water</text>

  <!-- Demo Badge -->
  <g transform="translate(500, 287)">
    <rect width="100" height="24" rx="12" fill="#FF8066"/>
    <text x="50" y="16" fill="#FFFFFF" font-size="10" font-family="'Poppins', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.8">FACILITY DEMO</text>
  </g>
</svg>