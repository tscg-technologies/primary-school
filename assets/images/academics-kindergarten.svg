<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_kindergarten" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid_kindergarten" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#2457A6" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="640" height="360" rx="16" fill="url(#bgGrad_kindergarten)"/>
  <rect width="640" height="360" rx="16" fill="url(#grid_kindergarten)"/>

  <!-- Decorative geometric accents -->
  <circle cx="80" cy="60" r="40" fill="#FFC857" opacity="0.3"/>
  <circle cx="580" cy="300" r="50" fill="#FF8066" opacity="0.2"/>
  <circle cx="560" cy="60" r="30" fill="#4D96FF" opacity="0.25"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 15)">
    
      <!-- Abacus, magnifying glass, joyful shapes -->
      <rect x="150" y="90" width="160" height="110" rx="10" fill="#E2E8F0" stroke="#2457A6" stroke-width="4"/>
      <line x1="160" y1="115" x2="300" y2="115" stroke="#263247" stroke-width="3"/>
      <line x1="160" y1="145" x2="300" y2="145" stroke="#263247" stroke-width="3"/>
      <line x1="160" y1="175" x2="300" y2="175" stroke="#263247" stroke-width="3"/>
      <!-- Beads -->
      <circle cx="180" cy="115" r="8" fill="#FF8066"/>
      <circle cx="200" cy="115" r="8" fill="#FF8066"/>
      <circle cx="270" cy="115" r="8" fill="#FFC857"/>
      <circle cx="190" cy="145" r="8" fill="#4D96FF"/>
      <circle cx="250" cy="145" r="8" fill="#5CD85A"/>
      <circle cx="270" cy="145" r="8" fill="#5CD85A"/>
      <circle cx="220" cy="175" r="8" fill="#FFC857"/>
      <circle cx="240" cy="175" r="8" fill="#FF8066"/>
      <!-- Paper Boat -->
      <polygon points="350,180 470,180 430,210 390,210" fill="#2457A6"/>
      <polygon points="410,120 410,180 455,180" fill="#FF8066"/>
      <polygon points="410,135 410,180 375,180" fill="#FFC857"/>
    
  </g>

  <!-- Title & Subtitle Banner at bottom -->
  <rect x="24" y="275" width="592" height="65" rx="12" fill="#263247" opacity="0.94"/>
  <text x="44" y="305" fill="#FFFFFF" font-size="19" font-family="'Nunito', sans-serif" font-weight="800" letter-spacing="0.5">Kindergarten (LKG & UKG)</text>
  <text x="44" y="325" fill="#FFC857" font-size="13" font-family="'Poppins', sans-serif" font-weight="500">Ages 3.5 – 5.5 Years • Foundational Literacy</text>

  <!-- Demo Badge -->
  <g transform="translate(500, 287)">
    <rect width="100" height="24" rx="12" fill="#FF8066"/>
    <text x="50" y="16" fill="#FFFFFF" font-size="10" font-family="'Poppins', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.8">ACADEMIC DEMO</text>
  </g>
</svg>