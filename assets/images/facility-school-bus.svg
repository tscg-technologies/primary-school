<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_transport" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF2FA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid_transport" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#2457A6" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="640" height="360" rx="16" fill="url(#bgGrad_transport)"/>
  <rect width="640" height="360" rx="16" fill="url(#grid_transport)"/>

  <!-- Decorative geometric accents -->
  <circle cx="80" cy="60" r="40" fill="#FFC857" opacity="0.3"/>
  <circle cx="580" cy="300" r="50" fill="#FF8066" opacity="0.2"/>
  <circle cx="560" cy="60" r="30" fill="#4D96FF" opacity="0.25"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 15)">
    
      <!-- School Bus -->
      <rect x="140" y="100" width="360" height="110" rx="20" fill="#FFC857" stroke="#263247" stroke-width="4"/>
      <!-- Bus roof curvature -->
      <rect x="140" y="85" width="340" height="25" rx="12" fill="#FFC857"/>
      <!-- Stripe -->
      <rect x="140" y="165" width="360" height="18" fill="#2457A6"/>
      <text x="320" y="179" fill="#FFFFFF" font-size="12" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">SCHOOL BUS DEMO</text>
      <!-- Windows -->
      <rect x="170" y="115" width="50" height="40" rx="6" fill="#4D96FF" opacity="0.8" stroke="#263247" stroke-width="2"/>
      <rect x="235" y="115" width="50" height="40" rx="6" fill="#4D96FF" opacity="0.8" stroke="#263247" stroke-width="2"/>
      <rect x="300" y="115" width="50" height="40" rx="6" fill="#4D96FF" opacity="0.8" stroke="#263247" stroke-width="2"/>
      <rect x="365" y="115" width="50" height="40" rx="6" fill="#4D96FF" opacity="0.8" stroke="#263247" stroke-width="2"/>
      <rect x="430" y="115" width="55" height="50" rx="6" fill="#4D96FF" opacity="0.9" stroke="#263247" stroke-width="2"/>
      <!-- Wheels -->
      <circle cx="210" cy="215" r="26" fill="#263247"/>
      <circle cx="210" cy="215" r="10" fill="#CBD5E1"/>
      <circle cx="430" cy="215" r="26" fill="#263247"/>
      <circle cx="430" cy="215" r="10" fill="#CBD5E1"/>
      <!-- Headlight -->
      <rect x="495" y="160" width="10" height="18" rx="4" fill="#FF8066"/>
    
  </g>

  <!-- Title & Subtitle Banner at bottom -->
  <rect x="24" y="275" width="592" height="65" rx="12" fill="#263247" opacity="0.94"/>
  <text x="44" y="305" fill="#FFFFFF" font-size="19" font-family="'Nunito', sans-serif" font-weight="800" letter-spacing="0.5">Safe Transportation</text>
  <text x="44" y="325" fill="#FFC857" font-size="13" font-family="'Poppins', sans-serif" font-weight="500">GPS Tracked Buses with Attendants & First Aid</text>

  <!-- Demo Badge -->
  <g transform="translate(500, 287)">
    <rect width="100" height="24" rx="12" fill="#FF8066"/>
    <text x="50" y="16" fill="#FFFFFF" font-size="10" font-family="'Poppins', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.8">FACILITY DEMO</text>
  </g>
</svg>