<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_classroom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF2FA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid_classroom" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#2457A6" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="640" height="360" rx="16" fill="url(#bgGrad_classroom)"/>
  <rect width="640" height="360" rx="16" fill="url(#grid_classroom)"/>

  <!-- Decorative geometric accents -->
  <circle cx="80" cy="60" r="40" fill="#FFC857" opacity="0.3"/>
  <circle cx="580" cy="300" r="50" fill="#FF8066" opacity="0.2"/>
  <circle cx="560" cy="60" r="30" fill="#4D96FF" opacity="0.25"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 15)">
    
      <!-- Teacher board -->
      <rect x="220" y="70" width="200" height="120" rx="10" fill="#263247" stroke="#FFC857" stroke-width="4"/>
      <line x1="240" y1="100" x2="330" y2="100" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <line x1="240" y1="120" x2="380" y2="120" stroke="#FFC857" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <line x1="240" y1="140" x2="310" y2="140" stroke="#FF8066" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <circle cx="370" cy="150" r="14" fill="#4D96FF" opacity="0.9"/>
      <!-- Desk and children silhouettes / cheerful shapes -->
      <rect x="140" y="220" width="120" height="70" rx="8" fill="#2457A6"/>
      <circle cx="200" cy="180" r="24" fill="#FFC857"/>
      <rect x="380" y="220" width="120" height="70" rx="8" fill="#FF8066"/>
      <circle cx="440" cy="180" r="24" fill="#FFC857"/>
      <!-- Books on desk -->
      <rect x="160" y="210" width="35" height="10" rx="2" fill="#FFC857"/>
      <rect x="165" y="202" width="25" height="8" rx="2" fill="#FF8066"/>
      <rect x="400" y="210" width="30" height="10" rx="2" fill="#5CD85A"/>
    
  </g>

  <!-- Title & Subtitle Banner at bottom -->
  <rect x="24" y="275" width="592" height="65" rx="12" fill="#263247" opacity="0.94"/>
  <text x="44" y="305" fill="#FFFFFF" font-size="19" font-family="'Nunito', sans-serif" font-weight="800" letter-spacing="0.5">Smart Classrooms</text>
  <text x="44" y="325" fill="#FFC857" font-size="13" font-family="'Poppins', sans-serif" font-weight="500">Interactive Digital Touchboards & Ergonomic Seating</text>

  <!-- Demo Badge -->
  <g transform="translate(500, 287)">
    <rect width="100" height="24" rx="12" fill="#FF8066"/>
    <text x="50" y="16" fill="#FFFFFF" font-size="10" font-family="'Poppins', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.8">FACILITY DEMO</text>
  </g>
</svg>