<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_music" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF2FA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid_music" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#2457A6" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="640" height="360" rx="16" fill="url(#bgGrad_music)"/>
  <rect width="640" height="360" rx="16" fill="url(#grid_music)"/>

  <!-- Decorative geometric accents -->
  <circle cx="80" cy="60" r="40" fill="#FFC857" opacity="0.3"/>
  <circle cx="580" cy="300" r="50" fill="#FF8066" opacity="0.2"/>
  <circle cx="560" cy="60" r="30" fill="#4D96FF" opacity="0.25"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 15)">
    
      <!-- Music notes and instruments -->
      <circle cx="220" cy="190" r="22" fill="#2457A6"/>
      <line x1="240" y1="190" x2="240" y2="100" stroke="#2457A6" stroke-width="6" stroke-linecap="round"/>
      <circle cx="340" cy="170" r="22" fill="#FF8066"/>
      <line x1="360" y1="170" x2="360" y2="80" stroke="#FF8066" stroke-width="6" stroke-linecap="round"/>
      <line x1="240" y1="100" x2="360" y2="80" stroke="#263247" stroke-width="8"/>
      <!-- Drum -->
      <ellipse cx="440" cy="150" rx="40" ry="18" fill="#FFC857" stroke="#263247" stroke-width="3"/>
      <path d="M400 150v50c0 10 20 18 40 18s40-8 40-18v-50" fill="#FFC857" stroke="#263247" stroke-width="3"/>
      <!-- Drum sticks -->
      <line x1="390" y1="120" x2="420" y2="145" stroke="#2457A6" stroke-width="4" stroke-linecap="round"/>
      <line x1="490" y1="120" x2="460" y2="145" stroke="#2457A6" stroke-width="4" stroke-linecap="round"/>
    
  </g>

  <!-- Title & Subtitle Banner at bottom -->
  <rect x="24" y="275" width="592" height="65" rx="12" fill="#263247" opacity="0.94"/>
  <text x="44" y="305" fill="#FFFFFF" font-size="19" font-family="'Nunito', sans-serif" font-weight="800" letter-spacing="0.5">Spring Rhythm Recital</text>
  <text x="44" y="325" fill="#FFC857" font-size="13" font-family="'Poppins', sans-serif" font-weight="500">Activities • Percussion & Vocal Harmonies</text>

  <!-- Demo Badge -->
  <g transform="translate(500, 287)">
    <rect width="100" height="24" rx="12" fill="#FF8066"/>
    <text x="50" y="16" fill="#FFFFFF" font-size="10" font-family="'Poppins', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.8">GALLERY DEMO</text>
  </g>
</svg>