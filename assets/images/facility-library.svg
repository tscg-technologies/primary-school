<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_library" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF2FA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid_library" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#2457A6" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="640" height="360" rx="16" fill="url(#bgGrad_library)"/>
  <rect width="640" height="360" rx="16" fill="url(#grid_library)"/>

  <!-- Decorative geometric accents -->
  <circle cx="80" cy="60" r="40" fill="#FFC857" opacity="0.3"/>
  <circle cx="580" cy="300" r="50" fill="#FF8066" opacity="0.2"/>
  <circle cx="560" cy="60" r="30" fill="#4D96FF" opacity="0.25"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 15)">
    
      <!-- Bookshelves -->
      <rect x="120" y="60" width="400" height="220" rx="14" fill="#E2E8F0" stroke="#2457A6" stroke-width="3"/>
      <!-- Shelf 1 -->
      <line x1="120" y1="130" x2="520" y2="130" stroke="#2457A6" stroke-width="4"/>
      <rect x="140" y="75" width="20" height="55" rx="3" fill="#FF8066"/>
      <rect x="165" y="70" width="24" height="60" rx="3" fill="#2457A6"/>
      <rect x="194" y="80" width="18" height="50" rx="3" fill="#FFC857"/>
      <rect x="217" y="72" width="25" height="58" rx="3" fill="#4D96FF"/>
      <rect x="247" y="76" width="22" height="54" rx="3" fill="#5CD85A"/>
      <!-- Shelf 2 -->
      <line x1="120" y1="200" x2="520" y2="200" stroke="#2457A6" stroke-width="4"/>
      <rect x="150" y="145" width="22" height="55" rx="3" fill="#FFC857"/>
      <rect x="177" y="140" width="26" height="60" rx="3" fill="#FF8066"/>
      <rect x="208" y="150" width="20" height="50" rx="3" fill="#2457A6"/>
      <rect x="233" y="142" width="24" height="58" rx="3" fill="#5CD85A"/>
      <!-- Reading globe & beanbag -->
      <circle cx="430" cy="160" r="26" fill="#4D96FF"/>
      <circle cx="430" cy="160" r="24" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M430 186v14M420 200h20" stroke="#263247" stroke-width="4"/>
      <path d="M300 240c0-20 40-20 40 0v20h-40z" fill="#FF8066" opacity="0.9"/>
    
  </g>

  <!-- Title & Subtitle Banner at bottom -->
  <rect x="24" y="275" width="592" height="65" rx="12" fill="#263247" opacity="0.94"/>
  <text x="44" y="305" fill="#FFFFFF" font-size="19" font-family="'Nunito', sans-serif" font-weight="800" letter-spacing="0.5">Library & Reading Zone</text>
  <text x="44" y="325" fill="#FFC857" font-size="13" font-family="'Poppins', sans-serif" font-weight="500">Curated Age-Appropriate Children Literature</text>

  <!-- Demo Badge -->
  <g transform="translate(500, 287)">
    <rect width="100" height="24" rx="12" fill="#FF8066"/>
    <text x="50" y="16" fill="#FFFFFF" font-size="10" font-family="'Poppins', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.8">FACILITY DEMO</text>
  </g>
</svg>